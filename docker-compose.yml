version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: priceloop
      POSTGRES_PASSWORD: priceloop
      POSTGRES_DB: priceloop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceloop"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Dev override: the image's default CMD has no --reload (production-safe);
    # local dev explicitly opts into it here instead.
    command: uvicorn app.main:app --app-dir /app/backend --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Both packages mounted for hot-reload -- previously only ./backend
      # was mounted, so `scraper.*` was silently unavailable in the running
      # container even in local dev.
      - ./backend:/app/backend
      - ./scraper:/app/scraper
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --workdir /app/backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./scraper:/app/scraper
    restart: unless-stopped

volumes:
  pgdata:
