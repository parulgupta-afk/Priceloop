<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="priceloop-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#priceloop-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Inner Background Contrast -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#030712" fill-opacity="0.3" />
  
  <!-- Trending Up Chart Line / Price Loop -->
  <path d="M26 66 L42 50 L54 60 L74 36" stroke="url(#line-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Arrow Head -->
  <path d="M58 36 H74 V52" stroke="url(#line-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Market Node Accent -->
  <circle cx="54" cy="60" r="3.5" fill="#ffffff" />
  <circle cx="42" cy="50" r="3" fill="#ffffff" opacity="0.9" />
</svg>
