version: "3.9"

# Production compose: no bind mounts (the image is the deployable artifact,
# not a window into the host filesystem), no --reload, migrations run
# exactly once by a dedicated service instead of racing on every container
# start, and Postgres/Redis are not published to the host at all -- only
# the backend needs to be reachable from outside this network.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No `ports:` here on purpose -- only other containers on this compose
    # network can reach Postgres, never the host machine directly.

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Same reasoning: no host port published.

  # Runs once per deployment, applies pending migrations, then exits.
  # backend/worker wait for this to *complete successfully* before they
  # start -- migrations never race against app startup, and never run
  # redundantly once per worker replica.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic -c /app/backend/alembic.ini upgrade head
    working_dir: /app/backend
    env_file: .env
    environment:
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --workdir /app/backend
    env_file: .env
    environment:
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
